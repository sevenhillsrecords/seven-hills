version: 2

models:
  - name: dim_product
    description: "Core product dimension containing unique releases and formats, excluding dynamic pricing."
    columns:
      - name: product_key
        description: "Unique surrogate key combining catalog number, item URL and package."
        tests:
          - unique
          - not_null
      - name: item_name
        description: "The product name."
        tests:
          - not_null
      - name: package
        description: "Physical format or edition (e.g., 2x12'' Vinyl, CD, Digital)."
        tests:
          - not_null
      - name: item_url
        description: "URL link to buy the product."
        tests:
          - not_null
      - name: catalog_number
        description: "Cat number for the release e.g. SHR001"

  - name: dim_product_price_history
    description: "Slowly Changing Dimension Type 2 tracking price revisions and attributes for label products over time."
    columns:
      - name: product_version_key
        description: "Unique surrogate key combining catalog number, package, and valid_from date."
        tests:
          - unique
          - not_null
      - name: product_key
        description: "FK to dim_product."
        tests:
          - not_null
      - name: item_name
        description: "The product name."
        tests:
          - not_null
      - name: package
        description: "Physical format or edition (e.g., 2x12'' Vinyl, CD, Digital)."
        tests:
          - not_null
      - name: item_url
        description: "URL link to buy the product."
        tests:
          - not_null
      - name: item_price
        description: "The price of the product during this specific effective period."
      - name: valid_from
        description: "Start timestamp for when this price took effect."
        tests:
          - not_null
      - name: valid_to
        description: "End timestamp for when this price changed (null if current active price)."
      - name: is_current
        description: "Boolean flag indicating whether this is the current active price version."