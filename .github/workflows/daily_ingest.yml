name: Daily Bandcamp Ingestion

on:
  schedule:
    - cron: '0 8 * * *' # Runs every day at 8:00 AM UTC
  workflow_dispatch: # Allows you to trigger it manually from the GitHub website

jobs:
  run-ingestion:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Download your repository code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install required packages from your requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run your script while securely injecting your secrets as environment variables
      - name: Run Python script
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python bandcamp_api.py  # Replace with your actual script filename